name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first, and the order matters. The hosts resolve `core` through its
      # exports map to dist/*.d.ts, so on a clean checkout there are no types to
      # lint or typecheck against until core has been built once.
      - run: pnpm -r build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm -r typecheck

      # CI has no GPU, so nothing here runs live inference. The agent loop is
      # covered by RecordingProvider replay instead (CLAUDE.md hard rule 6).
      - run: pnpm -r test
