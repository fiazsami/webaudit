<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAudit</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="site">
        <h1>WebAudit</h1>
        <p id="site-url" class="url">No page selected</p>
      </div>
      <div class="controls">
        <button id="audit" type="button">Audit this page</button>
        <p id="engine" class="engine">Analyzers only — no model loaded</p>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="model" aria-label="Model">
      <div class="model-row">
        <label for="model">Model</label>
        <select id="model"></select>
        <button id="explain" type="button" disabled>Explain findings</button>
        <button id="read-terms" type="button" disabled>Read the terms</button>
        <button id="agent" type="button" disabled>Full audit</button>
      </div>
      <p id="model-note" class="model-note"></p>
      <progress id="model-progress" max="100" value="0" hidden></progress>
      <p id="model-progress-text" class="model-note" hidden></p>
    </section>

    <main id="findings" aria-label="Findings"></main>

    <section id="tos" class="tos" aria-label="Terms of service"></section>

    <footer>
      <p>
        <a id="open-workbench" href="#">Open the workbench</a> — history and traces.
      </p>
      <details id="raw">
        <summary>Raw snapshot</summary>
        <pre id="raw-json"></pre>
      </details>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
