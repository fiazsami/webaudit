<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The same policy the manifest applies to extension pages (docs/08). It is
      repeated here so the harness can also be served over http://localhost and
      still be under WebLLM's real constraints: Chrome refuses automated
      navigation to chrome-extension:// pages, so the driver uses the localhost
      route. In the extension the two policies intersect, which is no weaker.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'wasm-unsafe-eval'; object-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com"
    />
    <title>WebAudit — spike S2</title>
    <style>
      body {
        font:
          13px/1.5 ui-monospace,
          monospace;
        margin: 1rem;
        max-width: 60rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Spike S2 — WebLLM in an extension page</h1>
    <p>Driven over CDP; results are read from <code>window.__s2</code>.</p>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
